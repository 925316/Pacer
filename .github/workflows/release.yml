name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Install Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Test
        run: gradle :core-motion:test :xposed:testDebugUnitTest :app:testDebugUnitTest
      - name: Build
        run: gradle :app:assembleDebug
      - name: Rename APK
        run: |
          VERSION=$(grep APP_VERSION_NAME gradle.properties | cut -d= -f2)
          cp app/build/outputs/apk/debug/app-debug.apk "pacer-${VERSION}.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pacer-*.apk --title "Pacer $GITHUB_REF_NAME" --generate-notes
