name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Run core-motion tests
        run: gradle :core-motion:test --stacktrace

  publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Use preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Install platform and build-tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify the APK carries the libxposed module
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "inspecting $APK"
          unzip -l "$APK" | grep -F "META-INF/xposed/module.prop"
          unzip -l "$APK" | grep -F "META-INF/xposed/java_init.list"
          unzip -p "$APK" "classes*.dex" | grep -a -F "org/pacer/hook/PacerHook"
          echo "module declaration and entry class are packaged"
      - name: Rename APK with version
        run: |
          VERSION=$(grep APP_VERSION_NAME gradle.properties | cut -d= -f2)
          SRC=app/build/outputs/apk/debug/app-debug.apk
          cp "$SRC" "pacer-${VERSION}-debug.apk"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep APP_VERSION_NAME gradle.properties | cut -d= -f2)
          gh release create "${GITHUB_REF_NAME}" \
            "pacer-${VERSION}-debug.apk" \
            --title "Pacer ${GITHUB_REF_NAME}" \
            --notes "Automated build from source. Debug-signed APK for research and lawful testing only."
