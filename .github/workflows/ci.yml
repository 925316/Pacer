name: ci

# Publishing lives in release.yml. This artefact is signed with a per-runner debug key, so it
# can never upgrade a released install.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Install Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # Named instead of `test`, which skips the app and hook suites.
      - name: Test
        run: gradle :core-motion:test :xposed:testDebugUnitTest :app:testDebugUnitTest

      - name: Build
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pacer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
