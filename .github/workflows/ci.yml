name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Run core-motion tests
        run: gradle :core-motion:test --stacktrace --info

  android-build:
    runs-on: ubuntu-latest
    needs: core-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Use preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Install platform and build-tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Check every named hook target against the compile SDK
        run: gradle :xposed:testDebugUnitTest --stacktrace
      - name: Assemble debug APKs
        run: gradle :app:assembleDebug :xposed:assembleDebug --stacktrace
      - name: Verify the APK carries the libxposed module
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "inspecting $APK"
          unzip -l "$APK" | grep -F "META-INF/xposed/module.prop"
          unzip -l "$APK" | grep -F "META-INF/xposed/java_init.list"
          unzip -p "$APK" "META-INF/xposed/scope.list" | grep -F "system"
          unzip -p "$APK" "META-INF/xposed/scope.list" | grep -F "com.android.phone"
          unzip -p "$APK" "META-INF/xposed/scope.list" | grep -F "com.android.bluetooth"
          unzip -p "$APK" "classes*.dex" | grep -a -F "org/pacer/hook/PacerHook"
          echo "module declaration and entry class are packaged"
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pacer-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            xposed/build/outputs/aar/*.aar
