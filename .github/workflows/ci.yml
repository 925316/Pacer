name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Run core-motion tests
        run: gradle :core-motion:test --stacktrace --info

  android-build:
    runs-on: ubuntu-latest
    needs: core-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Use preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Install platform and build-tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0"
      - name: Assemble debug APKs
        run: gradle :app:assembleDebug :xposed:assembleDebug --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pacer-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            xposed/build/outputs/aar/*.aar
